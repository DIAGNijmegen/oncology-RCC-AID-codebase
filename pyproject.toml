[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oncology-rcc-dataset"
version = "0.1.0"
description = "Oncology Renal Cell Carcinoma (RCC) dataset tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sarah De Boer, Hartmut Häntze"},
]
dependencies = [
    "pandas>=2.0",
    "SimpleITK>=2.0",
    "tqdm",
    "pydicom"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
rcc-aid-analyze = "oncology_rcc_aid_codebase.analyze_data:main"
rcc-aid-summarize = "oncology_rcc_aid_codebase.summary_analysis:main"
rcc-aid-analyze-figure = "oncology_rcc_aid_codebase.data_analysis_figures:main"
rcc-aid-example-cases-figure = "oncology_rcc_aid_codebase.example_cases_figure:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
